[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alert-scanner"
version = "0.1.0"
description = "Website security scanner that filters and ranks OWASP ZAP alerts."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Rudolf Baranko" },
    { name = "Dawid Hamryszczak" },
    { name = "Konrad Klima" },
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
alert-scanner = "alert_scanner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
